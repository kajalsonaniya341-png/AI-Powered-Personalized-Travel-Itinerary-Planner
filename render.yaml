# Render blueprint for the AI-Powered Personalized Travel Itinerary Planner.
# Secrets are NOT stored here: set MONGODB_URI in the Render dashboard.
services:
  - type: web
    name: travel-itinerary-planner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: SEED_ON_STARTUP
        value: "true"
      - key: AI_PROVIDER
        value: anthropic
      - key: AI_API_KEY
        sync: false
